<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="static/css/footer.css">
</head>
<body>
  <footer>
    <div class="content_box">
      {% for head in data%}
      <div class="footer_box">
        <h4 class="footer_header"> {{head.title}} </h4>
        {% for lower in head.items %}
        <a class="footer_content" href="{{ lower.href }}">{{ lower.name }}</a>
        {% endfor %}
      </div>
      {% endfor %}
    </div>
    <hr>

  </footer>
  
</body>
</html>
